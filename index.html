<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麻将算钱</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mu:#76736b;--ac:#0f7b5f;--bd:#e3dfd5;--pos:#0f7b5f;--neg:#c2392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161814;--card:#22251f;--tx:#f0eee8;--mu:#a29f95;--ac:#3fbf9a;--bd:#34382f;--pos:#4fd1a5;--neg:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161814;--card:#22251f;--tx:#f0eee8;--mu:#a29f95;--ac:#3fbf9a;--bd:#34382f;--pos:#4fd1a5;--neg:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;padding:12px;max-width:520px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx);font-size:14px}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:0 4px}
.st{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.st:last-child{border:0}
.st .c{display:flex;align-items:center;gap:12px}
.st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px}
.st b{min-width:20px;text-align:center}
.go{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;margin-top:12px}
.sm{padding:8px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:14px}
.tot{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:18px}
.tot:last-child{border:0}
.p{color:var(--pos)}.n{color:var(--neg)}
.h{padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
small{color:var(--mu)}
.bd{border:1px solid var(--neg);color:var(--neg);background:none;border-radius:10px;font-size:12px;padding:1px 8px;margin-left:6px}
.hh{margin:6px 0 0 8px;padding-left:8px;border-left:2px solid var(--bd);font-size:13px;color:var(--mu)}
#land{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;padding:20vh 24px 0}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;align-items:center;justify-content:center;padding:20px}.ov.on{display:flex}
.bx{background:var(--card);border-radius:14px;padding:16px;max-width:360px;width:100%;text-align:center}
#qr{background:#fff;padding:10px;display:inline-block;border-radius:8px;margin:10px 0}
#ad .bx{padding:0;background:none;position:relative;max-width:380px}#ad img{width:100%;max-height:82vh;object-fit:contain;border-radius:12px;display:block}
.cx{position:absolute;top:-14px;right:-6px;width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:#222;color:#fff;font-size:20px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<h1>🀄 麻将算钱</h1>
<div id="sync" style="font-size:13px;color:var(--mu);margin:-6px 0 10px"></div>
<div id="land"><h1>你叫什么名字？</h1><input id="nm0" placeholder="输入你的名字" maxlength="12"><button class="go" onclick="join($('nm0').value)">加入牌局</button><button class="sm" style="margin-top:10px" onclick="location.hash=''">← 返回大厅</button></div>
<div id="lobby" style="display:none"><div class="chips" style="margin-bottom:12px"><button class="sm" onclick="showQR(baseUrl())">📱 分享二维码</button><button class="sm" id="lg" onclick="loginBtn()">管理员登录</button></div><div class="card"><div style="font-weight:600">创建新牌局</div><label>牌局名称 (可不填)</label><input id="sn" maxlength="16" placeholder="例如：周五牌局"><label>模式</label><select id="sm"><option value="4a">四人 RM1</option><option value="4b">四人 RM2</option><option value="3">三人</option></select><button class="go" onclick="newS()">创建并加入</button></div><div class="card"><div style="font-weight:600;margin-bottom:4px">进行中的牌局 (每个最多4人)</div><div id="ls"><small>加载中…</small></div></div></div>
<div id="app">
<div class="card"><div class="tabs" id="tabs"></div><div id="rate"></div><label>玩家 (点自己的名字可改名)</label><div class="chips" id="pl"></div></div>
<div class="card" id="form"></div>
<div class="card"><div style="font-weight:600;margin-bottom:4px">总结算</div><div id="totals"></div></div>
<div class="card"><div style="font-weight:600;margin-bottom:4px">记录</div><div id="kong"></div><div id="hist"></div>
<button class="sm" style="margin-top:10px" onclick="clearAll()">清空所有记录</button></div>
<div class="chips" style="margin-bottom:12px"><button class="sm" onclick="location.hash=''">← 返回大厅</button><button class="sm" id="endb" style="color:var(--neg);display:none" onclick="BK.end()">结束牌局</button></div></div>
<div class="ov" id="lm"><div class="bx"><b>管理员登录</b><label>账号</label><input id="lid" autocapitalize="off" autocomplete="off"><label>密码</label><input id="lpw" type="password"><div id="lerr" style="color:var(--neg);font-size:13px;min-height:18px"></div><button class="go" style="margin-top:4px" onclick="doLogin()">登录</button><button class="sm" style="margin-top:8px" onclick="$('lm').classList.remove('on')">取消</button></div></div>
<div class="ov" id="qm"><div class="bx"><b>扫码加入牌局</b><br><div id="qr"></div><div id="qu" style="font-size:12px;color:var(--mu);word-break:break-all"></div><button class="go" onclick="$('qm').classList.remove('on')">关闭</button></div></div>
<div class="ov" id="ad"><div class="bx"><button class="cx" onclick="closeAd()">✕</button><img id="adimg" alt=""></div></div>

const M=()=>D.cfg.mode||'4a',is3=()=>M()==='3',NP=()=>is3()?3:4;
const PL=()=>Object.entries(D.players).map(([id,v])=>({id,...v})).sort((a,b)=>a.ts-b.ts);
const RL=()=>Object.entries(D.records).map(([id,v])=>({id,...v})).sort((a,b)=>a.ts-b.ts);
const nm=id=>D.players[id]?D.players[id].name:'?';
const base=r=>is3()?(r.fan||1)*(D.cfg.rate||0):M()==='4b'?(r.t==='z'?4:2):1;
function netOf(r){const ids=PL().map(p=>p.id),n={};ids.forEach(i=>n[i]=0);if(!(r.p in n))return n;
 const kv=M()==='4b'?[4,2]:[1,2];
 if(!is3()){const a=(r.an||0)*kv[0]+(r.gg||0)*kv[1];ids.forEach(j=>{if(j!==r.p){n[r.p]+=a;n[j]-=a}})}
 if(r.win){const b=base(r);ids.forEach(j=>{if(j!==r.p){let a=b+(is3()?0:(r.fei||0));if(r.t==='p'&&j===r.s)a+=b;n[r.p]+=a;n[j]-=a}})}
 return n}
function W(p,d){if(p==='game/cfg')D.cfg=d;else{const[c,id]=p.split('/');if(d===null)delete D[c][id];else D[c][id]=d}renderAll();BK.write(p,d)}
function join(name){name=(name||'').trim();if(!name)return;
 if(!me)me={id:uid()};if(!D.players[me.id]&&PL().length>=NP()){alert('这个牌局已满（最多4人）');location.hash='';return}
 me.name=name;try{localStorage.setItem('mj_me',JSON.stringify(me))}catch(e){}
 W('players/'+me.id,{name,ts:(D.players[me.id]||{}).ts||Date.now()})}
function onData(o){const rs=o.records||{};Object.values(rs).forEach(r=>{r.hist=Array.isArray(r.hist)?r.hist:r.hist?Object.values(r.hist):[]});
 D={cfg:(o.game&&o.game.cfg)||{mode:'4a',rate:1},players:o.players||{},records:rs};
 loaded=true;renderAll()}
function chMode(m){if(m===M())return;if(RL().length&&!confirm('切换模式会清空记录'))return;
 Object.keys(D.records).forEach(id=>W('records/'+id,null));W('game/cfg',{mode:m,rate:D.cfg.rate||1})}
function setRate(v){D.cfg.rate=parseFloat(v)||0;clearTimeout(tmr);tmr=setTimeout(()=>W('game/cfg',D.cfg),400)}
function rn(){const n=prompt('新名字',me.name);if(n&&n.trim())join(n)}
function rmP(id){if(confirm('移除 '+nm(id)+'？'))W('players/'+id,null)}
function clearAll(){if(confirm('清空所有记录？'))Object.keys(D.records).forEach(id=>W('records/'+id,null))}
function resetF(){F={an:0,gg:0,win:false,t:'z',s:'',fei:0,fan:1,edit:null}}
function fset(k,v){F[k]=v;renderForm()}
function fstep(k,d){F[k]=Math.max(k==='fan'?1:0,F[k]+d);renderForm()}
const stp=(t,k)=>`<div class="st"><span>${t}</span><span class="c"><button onclick="fstep('${k}',-1)">−</button><b>${F[k]}</b><button onclick="fstep('${k}',1)">+</button></span></div>`;
const chip=(on,fn,t)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${t}</button>`;
function renderForm(){const f=$('form');if(!me||!D.players[me.id]){f.innerHTML='';return}
 const A=F.edit&&D.records[F.edit]?D.records[F.edit].p:me.id,oth=PL().filter(p=>p.id!==A);
 let h=`<div style="font-weight:600">${F.edit?'修改 '+esc(nm(A))+' 的记录':'我的记录 · '+esc(me.name)}</div>`;
 if(!is3())h+=stp('暗杠','an')+stp('杠','gg');
 h+='<label>胡牌</label><div class="chips">'+chip(!F.win,"fset('win',false)",'没胡')+chip(F.win,"fset('win',true)",'我胡了')+'</div>';
 if(F.win){h+='<label>胡法</label><div class="chips">'+chip(F.t==='z',"fset('t','z')",'自摸')+chip(F.t==='p',"fset('t','p')",'点炮')+'</div>';
  if(F.t==='p')h+='<label>谁点炮？</label><div class="chips">'+oth.map(p=>chip(F.s===p.id,`fset('s','${p.id}')`,esc(p.name))).join('')+'</div>';
  h+=is3()?stp('番数','fan'):stp('飞 (每个+RM1)','fei')}
 h+=`<button class="go" onclick="submit()">${F.edit?'保存修改':'提交'}</button>`;
 if(F.edit)h+='<div class="chips" style="margin-top:8px"><button class="sm" onclick="resetF();renderForm()">取消</button><button class="sm" style="color:var(--neg)" onclick="delR()">删除这条</button></div>';
 f.innerHTML=h}
function submit(){const A=F.edit&&D.records[F.edit]?D.records[F.edit].p:me.id;
 if(!F.win&&!F.an&&!F.gg){alert('没有内容可提交');return}
 let s=F.s;if(F.win&&F.t==='p'&&(!s||s===A)){const o=PL().find(p=>p.id!==A);if(!o){alert('没有其他玩家');return}s=o.id}
 const v={an:F.an,gg:F.gg,win:F.win,t:F.win?F.t:'z',s:F.win&&F.t==='p'?s:'',fei:F.win?F.fei:0,fan:F.win?F.fan:1};
 if(F.edit){const r=D.records[F.edit];if(!r){resetF();renderForm();return}
  const was={an:r.an||0,gg:r.gg||0,win:!!r.win,t:r.t||'z',s:r.s||'',fei:r.fei||0,fan:r.fan||1};
  W('records/'+F.edit,{...r,...v,hist:[...(r.hist||[]),{ts:Date.now(),by:me.name,was}]})}
 else W('records/'+uid(),{p:me.id,ts:Date.now(),...v});
 resetF();renderForm()}
function delR(){if(confirm('删除这条记录？')){W('records/'+F.edit,null);resetF();renderForm()}}
function edit(id){const r=D.records[id];if(!r)return;F={an:r.an||0,gg:r.gg||0,win:!!r.win,t:r.t||'z',s:r.s||'',fei:r.fei||0,fan:r.fan||1,edit:id};renderForm();$('form').scrollIntoView()}
function tg(id){open[id]=!open[id];renderRes()}
function dsc(v){const a=[];if(!is3()&&(v.an||v.gg))a.push(`暗杠 ${v.an||0} · 杠 ${v.gg||0}`);
 if(v.win)a.push('胡 '+(v.t==='p'?`点炮(${esc(nm(v.s))})`:'自摸')+(is3()?` ${v.fan||1}番`:(v.fei?` 飞${v.fei}`:'')));return a.join(' | ')||'无'}
function renderTop(){if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
 $('tabs').innerHTML=[['3','三人'],['4a','四人 RM1'],['4b','四人 RM2']].map(([m,l])=>`<button class="${M()===m?'on':''}" onclick="chMode('${m}')">${l}</button>`).join('');
 $('rate').innerHTML=is3()?`<label>每番多少钱 (RM)</label><input type="number" inputmode="decimal" step="0.1" min="0" value="${D.cfg.rate||0}" oninput="setRate(this.value)">`:'';
 $('pl').innerHTML=PL().map(p=>p.id===(me&&me.id)?`<button class="chip on" onclick="rn()">${esc(p.name)}</button>`:`<span class="chip">${esc(p.name)}<button class="x" onclick="rmP('${p.id}')">×</button></span>`).join('')||'<small>还没有人加入</small>'}
function renderRes(){const ps=PL(),rs=RL(),t={},ka={},kg={};ps.forEach(p=>{t[p.id]=0;ka[p.id]=0;kg[p.id]=0});
 const ns=rs.map(r=>{const n=netOf(r);for(const i in n)t[i]+=n[i];if(r.p in ka){ka[r.p]+=r.an||0;kg[r.p]+=r.gg||0}return n});
 $('totals').innerHTML=ps.map(p=>`<div class="tot"><span>${esc(p.name)}</span><b class="${cl(t[p.id])}">${fm(t[p.id])}</b></div>`).join('')+sethtml(t,ps);
 $('kong').innerHTML=is3()?'':'<div style="font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--bd)"><b>杠统计</b>'+ps.map(p=>`<div>${esc(p.name)}：暗杠 ${ka[p.id]} · 杠 ${kg[p.id]}</div>`).join('')+'</div>';
 $('hist').innerHTML=rs.length?rs.map((r,k)=>{const n=ns[k],ln=ps.filter(p=>n[p.id]).map(p=>esc(p.name)+' '+fm(n[p.id])).join(' · ');
  const hs=r.hist&&r.hist.length;
  return `<div class="h"><b>${esc(nm(r.p))}</b> <small>${tm(r.ts)}</small>${hs?`<button class="bd" onclick="tg('${r.id}')">已编辑 ${open[r.id]?'▴':'▾'}</button>`:''}<button class="sm" style="float:right;padding:3px 10px" onclick="edit('${r.id}')">编辑</button><br>${dsc(r)}<br><small>${ln||'无变动'}</small>`+
  (hs&&open[r.id]?r.hist.slice().reverse().map(h=>`<div class="hh">${tm(h.ts)} ${esc(h.by)} 修改<br>改前：${dsc(h.was)}</div>`).join(''):'')+'</div>'}).reverse().join(''):'<small>还没有记录</small>'}
function renderAll(){const need=loaded&&!(me&&D.players[me.id]);$('land').style.display=need?'block':'none';if(need&&!$('nm0').value&&me&&me.name)$('nm0').value=me.name;renderTop();renderRes();$("endb").style.display=master?"":"none";
 const s=M()+PL().map(p=>p.id).join()+(me&&me.id)+F.edit;if(s!==sig){sig=s;renderForm()}}
function sethtml(t,ps){const c=ps.filter(p=>t[p.id]>.004).map(p=>({id:p.id,v:t[p.id]})).sort((a,b)=>b.v-a.v),d=ps.filter(p=>t[p.id]<-.004).map(p=>({id:p.id,v:-t[p.id]})).sort((a,b)=>b.v-a.v),o=[];let i=0,j=0;
 while(i<d.length&&j<c.length){const a=Math.min(d[i].v,c[j].v);o.push(`<div style="padding:3px 0"><b>${esc(nm(d[i].id))}</b> → <b>${esc(nm(c[j].id))}</b>：RM${a.toFixed(2).replace(/\.00$/,'')}</div>`);d[i].v-=a;c[j].v-=a;if(d[i].v<.005)i++;if(c[j].v<.005)j++}
 return '<div style="margin-top:10px;padding-top:10px;border-top:2px solid var(--bd);font-size:15px"><b>谁付给谁</b>'+(o.join('')||'<div><small>目前没有需要结算的</small></div>')+'</div>'}
function renderLobby(l){lastL=l;$('ls').innerHTML=l.length?l.map(s=>{const cap=s.mode==='3'?3:4,full=s.n>=cap;return `<div class="h"><b>${esc(s.name)}</b> <small>${s.mode==='3'?'三人':s.mode==='4b'?'四人 RM2':'四人 RM1'} · ${s.n}/${cap}人</small><div class="chips" style="margin-top:6px"><button class="sm" ${full?'disabled':''} onclick="location.hash='${s.code}'">${full?'已满':'加入'}</button><button class="sm" onclick="showQR(baseUrl()+'#${s.code}')">二维码</button>${master?`<button class="sm" style="color:var(--neg)" onclick="delS('${s.code}')">删除</button>`:''}</div></div>`}).join(''):'<small>暂时没有进行中的牌局，创建一个吧</small>'}
function newS(){BK.create($('sn').value.trim(),$('sm').value)}
const baseUrl=()=>location.origin+location.pathname;
function showQR(u){$('qr').innerHTML='';$('qu').textContent=u;try{new QRCode($('qr'),{text:u,width:220,height:220})}catch(e){$('qr').textContent='二维码加载失败'}$('qm').classList.add('on')}
function renderMaster(){$('lg').textContent=master?'退出管理员':'管理员登录';$('endb').style.display=master?'':'none';renderLobby(lastL)}
function loginBtn(){if(master){master=false;try{localStorage.removeItem('mj_master')}catch(e){}renderMaster()}else{$('lerr').textContent='';$('lm').classList.add('on')}}
function doLogin(){if($('lid').value.trim()==='masteracc'&&$('lpw').value==='123456'){master=true;try{localStorage.setItem('mj_master','1')}catch(e){}$('lm').classList.remove('on');$('lpw').value='';renderMaster()}else $('lerr').textContent='账号或密码错误'}
function delS(c){if(master&&confirm('删除这个牌局？所有记录都会清除'))BK.del(c)}
function closeAd(){$('ad').classList.remove('on')}
setInterval(()=>{const inS=location.hash.length>1&&loaded&&me&&D.players[me.id];
 if(!inS){lastAd=0;closeAd();return}
 const now=Date.now();if(!lastAd){lastAd=now;return}
 if(now-lastAd>=60000){lastAd=now;if(!$('ad').classList.contains('on')){$('adimg').src=ADS[adI%ADS.length];adI++;$('ad').classList.add('on')}}},1000);
function startBackend(cb){
 const FB='https://the-mahjong-calculator-default-rtdb.asia-southeast1.firebasedatabase.app';
 const room=()=>location.hash.slice(1),inLobby=()=>location.hash.length<2;
 const rq=(m,p,d,q)=>fetch(`${FB}/${p}.json${q||''}`,{method:m,body:d==null?undefined:JSON.stringify(d)}).then(r=>{if(!r.ok)throw 0;return r.json()});
 const view=()=>{const l=inLobby();$('lobby').style.display=l?'block':'none';$('app').style.display=l?'none':'block'};
 let last='';
 const poll=async()=>{try{
  if(inLobby()){const idx=await rq('GET','sessions')||{},now=Date.now();
   const l=Object.entries(idx).filter(([c,v])=>v.name&&now-v.ts<12*36e5).sort((a,b)=>b[1].ts-a[1].ts);
   const ns=await Promise.all(l.map(([c])=>rq('GET','rooms/'+c+'/players',null,'?shallow=true').then(o=>Object.keys(o||{}).length).catch(()=>0)));
   renderLobby(l.map(([c,v],i)=>({code:c,...v,n:ns[i]})));$('sync').textContent='🟢 已连接';return}
  const o=await rq('GET','rooms/'+room())||{};$('sync').textContent='🟢 牌局 '+room()+'：大家实时同步';
  const j=JSON.stringify(o);if(j!==last){last=j;cb(o)}
 }catch(e){$('sync').textContent='⚠️ 连接失败，请检查 Firebase 设置'}};
 view();poll();setInterval(poll,2500);
 addEventListener('hashchange',()=>{view();last='';D={cfg:{mode:'4a',rate:1},players:{},records:{}};loaded=false;sig='';open={};resetF();renderAll();poll()});
 return{
  write:(p,d)=>rq(d===null?'DELETE':'PUT','rooms/'+room()+'/'+p,d).then(()=>rq('PATCH','sessions/'+room(),{ts:Date.now(),mode:D.cfg.mode||'4a'})).then(poll).catch(()=>{$('sync').textContent='⚠️ 保存失败'}),
  create:async(name,mode)=>{const c=Math.random().toString(36).slice(2,6).toUpperCase();
   try{await rq('PUT','sessions/'+c,{name:name||'牌局 '+c,mode,ts:Date.now()});await rq('PUT','rooms/'+c+'/game/cfg',{mode,rate:1});location.hash=c}catch(e){alert('创建失败')}},
  del:async(c)=>{try{await rq('DELETE','sessions/'+c);await rq('DELETE','rooms/'+c)}catch(e){alert('删除失败')}poll()},
  end:async()=>{if(!master||!confirm('结束并删除这个牌局？所有记录都会清除'))return;
   try{await rq('DELETE','sessions/'+room());await rq('DELETE','rooms/'+room())}catch(e){}location.hash=''}}}

resetF();BK=startBackend(onData);renderAll();renderMaster();
</script>
</body>
</html>
